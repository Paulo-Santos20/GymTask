name: Bug report
description: Something in GymTask is broken or not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What did you do?
      description: Steps to reproduce, as precisely as you can.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include error messages, console output, or screenshots if you have them.
    validations:
      required: true

  - type: dropdown
    id: setup
    attributes:
      label: How are you running GymTask?
      options:
        - Self-hosted (docker compose)
        - Vercel + Firebase
        - Frontend dev server (npm run dev)
        - Other / not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser & OS
      placeholder: e.g. Safari 17 on iOS 18, Chrome 126 on Android
    validations:
      required: true

  - type: checkboxes
    id: login
    attributes:
      label: Is this about login?
      description: >
        Sign-in is Firebase e-mail/senha. If the API rejects requests, check your
        `ORIGIN` in `.env` against the domain you're accessing GymTask from before
        reporting. See the [self-hosting guide](../../docs/SELF_HOSTING.md).
      options:
        - label: Yes, this is a login issue and I've already checked ORIGIN
