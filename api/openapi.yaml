# GymTask HTTP API — hand-written OpenAPI 3.1 spec.
# Source of truth: api/server.js (a single framework-free Node file). Every route the
# server registers is documented here; if you add a route there, add it here too.
# Browsable version: https://gytask.example.com/api.html
openapi: 3.1.0

info:
  title: GymTask API
  version: 1.3.8
  summary: Session auth + per-user state storage for GymTask
  description: |
    The backend of GymTask — a free, open-source gym & body-weight tracker,
    derived from [openGym](https://github.com/DuarteSantos8/openGym). One Node file, no
    framework, JSON-file storage, HMAC-signed session cookies.

    ### Authentication
    Sign-in is handled **client-side** (Firebase email/password in the app); this API
    exposes no credential-verification route. Authenticated routes work with the
    HMAC-signed session cookie.

    ### Sessions
    The cookie/bearer value is `<payload>.<hmac>` where the payload is
    `<uid>:<expiry-ms>:<session-version>`, signed with a per-instance secret
    (HMAC-SHA256). Sessions last 90 days — the expiry is baked into each token
    when it is issued. `POST /api/logout/all`
    bumps the user's session version, which invalidates every token ever issued for
    the account.

    ### CSRF
    State-changing browser requests must come from the app's own origin. The server
    checks `Sec-Fetch-Site` (falling back to `Origin` vs the configured `ORIGIN`);
    a mismatch is refused with `403 {"error":"cross-origin request refused"}` on any
    non-GET route. Exempt: any request authenticated with a Bearer token.

    ### Coach
    `/api/coach/*` runs background jobs: enqueue answers `202 {job:{id}}` and
    state comes from `GET /api/coach/status`. Rejections are
    `{"error", "code"}` with `code` one of `off | busy | consent | cap | shared |
    unprivileged` — the human message never leaks provider detail. The deployed
    Firebase app additionally calls the `coach` and `nutritionProxy` Cloud
    Functions directly (documented under the `functions` tag); this server never
    proxies them.

    ### Environment-dependent behavior
    - `ALLOW_GUEST=0` — hides the client-side "continue without account" mode; the
      server merely reports the flag via `GET /api/config` (guest mode never talks to
      this API at all).
    - `AUDIT_LOG` (default on), `AUDIT_MAX` (default 5000 events), `AUDIT_DAYS`
      (default 90), `AUDIT_IP` (`off` | `net` | `full`, default off) — shape the audit
      log written to `./data/audit.log`.

    ### Conventions
    - Every response body is JSON with `Cache-Control: no-store`.
    - Errors are always `{"error": "<human-readable message>"}`.
    - Unknown method+path combinations return `404 {"error":"not found"}`; an unhandled
      exception returns `500 {"error":"server error"}`.
    - Request bodies are parsed as JSON regardless of Content-Type. A body that does
      not parse, or parses to anything but an object (`null`, a string, an array), is
      `400 {"error":"invalid json"}` on every route that reads one; an empty body counts
      as `{}`. A body over 5 MiB is `413 {"error":"body too large"}`; the rest of the
      upload is discarded so the answer reaches the client.
    - CORS: the request's `Origin` is reflected in `Access-Control-Allow-Origin`
      **without** `Allow-Credentials` — cross-origin callers can only ever
      authenticate with a Bearer token, never with the cookie.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  contact:
    name: GymTask
    url: https://github.com/Paulo-Santos20/GymTask

servers:
  - url: /
    description: Same origin as the GymTask web app (the normal deployment)
  - url: https://gytask.example.com
    description: Your self-hosted instance

tags:
  - name: meta
    description: Health and public configuration
  - name: auth
    description: Session resolution and sign-out (sign-in itself is client-side)
  - name: data
    description: Per-user state sync (the whole app state as one JSON blob)
  - name: push
    description: Web Push (VAPID) subscriptions, rest-timer and test pushes
  - name: activity
    description: Live-workout presence heartbeat
  - name: coach
    description: >-
      AI Coach jobs and proposals (server mode — the demo build and the
      bring-your-own-key device mode answer client-side and never hit these)
  - name: functions
    description: Firebase Cloud Functions deployed alongside the app (not served by this API)

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Health check
      description: Always public. Also reports how many user accounts exist.
      security: []
      responses:
        '200':
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  users:
                    type: integer
                    description: Number of registered user accounts.
              example: { ok: true, users: 7 }

  /api/config:
    get:
      tags: [meta]
      operationId: getConfig
      summary: Public instance configuration
      description: |
        The flags the login screen needs before anyone is signed in. `invite_only`
        is kept for older clients and is always false; `allow_guest` reflects the
        `ALLOW_GUEST` environment variable on the server.
      security: []
      responses:
        '200':
          description: Instance flags.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite_only:
                    type: boolean
                    description: Always false — kept for compatibility with older clients.
                  allow_guest:
                    type: boolean
                    description: >-
                      When false, the client hides "continue without account".
                      Guest mode is purely client-side and never calls this API.
              example: { invite_only: false, allow_guest: false }

  /api/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Who am I?
      description: Resolves the current session to a user.
      responses:
        '200':
          description: A valid session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out (this device)
      description: >-
        Clears the session cookie. Always succeeds — an invalid or missing session is
        a no-op. The token itself stays cryptographically valid until it expires; use
        /api/logout/all to revoke tokens.
      security: []
      responses:
        '200':
          description: Cookie cleared.
          headers:
            Set-Cookie:
              description: Expires the session cookie(s).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }

  /api/logout/all:
    post:
      tags: [auth]
      operationId: logoutAll
      summary: Sign out everywhere
      description: |
        Bumps the account's session version, which invalidates **every** cookie and
        Bearer token ever issued for it — on every device, including a copy someone
        walked off with. Signing back in works immediately.
        Also clears the caller's own cookie.
      responses:
        '200':
          description: All sessions revoked.
          headers:
            Set-Cookie:
              description: Expires the caller's session cookie(s).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/data:
    get:
      tags: [data]
      operationId: getData
      summary: Pull the account's app state
      description: >-
        Returns the caller's entire app state as one JSON blob, or `{"state": null}`
        if nothing has been synced yet, together with `rev`, the server's revision of
        that document (0 when there is none). A client keeps the `rev` it last read or
        wrote and sends it back as `baseRev` on the next push, which lets the server
        refuse a write over a document the client never saw (see the 409 on PUT).
      responses:
        '200':
          description: The stored state, or null, and its revision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    oneOf:
                      - $ref: '#/components/schemas/State'
                      - type: 'null'
                  rev:
                    type: integer
                    description: Server revision of the stored document; 0 when there is none.
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [data]
      operationId: putData
      summary: Push the account's app state
      description: |
        Replaces the stored state wholesale (atomic write; there is no merge on the
        server). The `active` field — an in-progress workout — is stripped before
        saving: a running session belongs to the device running it. Body limit 5 MiB.

        With `baseRev` the write is conditional: it goes through only when `baseRev`
        equals the document's current revision, and answers 409 with the current
        document otherwise — the client merges the two and pushes again with the
        revision it was given. Without `baseRev` the write is unconditional (clients
        from before revisions, and deliberate replaces such as a backup import). The
        server stamps the new revision into the document as `_rev`; a `_rev` sent by
        the client is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { $ref: '#/components/schemas/State' }
                baseRev:
                  oneOf: [{ type: integer }, { type: 'null' }]
                  description: >-
                    The revision this client last read or wrote. Omit or null for an
                    unconditional overwrite.
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  ts:
                    oneOf: [{ type: number }, { type: 'null' }]
                    description: Echo of the pushed state's `_ts`, if present.
                  rev:
                    type: integer
                    description: The revision the write produced.
        '409':
          description: >-
            `baseRev` is not the current revision — another client wrote since this one
            last read. Carries the current document so the client can merge and retry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, const: conflict }
                  rev: { type: integer }
                  state:
                    oneOf:
                      - $ref: '#/components/schemas/State'
                      - type: 'null'
        '400':
          description: >-
            `state` missing or not an object, `state` an array, or `workouts`/`routines`
            set to anything other than an array or null. Entries inside those two arrays
            that are not objects (`null`, numbers, nested arrays) are dropped before the
            write rather than refused, so a client with a damaged copy still syncs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missing: { value: { error: "state required" } }
                invalid: { value: { error: "invalid state" } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/data/rev:
    get:
      tags: [data]
      summary: Current revision of the caller's profile state
      description: |
        The `rev` that `GET /api/data` would return, without the document. Signed-in clients poll
        this while open and on every return to the foreground and fetch the document only when
        the number changed.
      responses:
        '200':
          description: The current revision (0 when the profile has no state yet).
          content:
            application/json:
              schema:
                type: object
                properties:
                  rev: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/push/public-key:
    get:
      tags: [push]
      operationId: pushPublicKey
      summary: VAPID public key
      description: >-
        The instance's Web-Push application server key (generated once at first boot),
        for `PushManager.subscribe({applicationServerKey})`. Public.
      security: []
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    description: base64url-encoded P-256 public key.

  /api/push/subscribe:
    post:
      tags: [push]
      operationId: pushSubscribe
      summary: Register a Web-Push subscription
      description: |
        Stores the browser's `PushSubscription` for this account. Only `endpoint` and
        the two protocol keys are kept. The endpoint must be a public `https://` URL —
        private/loopback/link-local addresses are refused (here and again at send
        time, against DNS rebinding). At most 20 subscriptions per user; the oldest
        are dropped first. Re-subscribing an existing endpoint replaces it and keeps
        its original `created` — the client re-sends its subscription on every
        signed-in boot, so a row the instance lost comes back on its own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription]
              properties:
                subscription: { $ref: '#/components/schemas/PushSubscription' }
                deviceId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{8,64}$'
                  description: >-
                    A token the browser made up for itself (stored in its localStorage),
                    so rest-timer pushes can be aimed at the device that started the
                    rest. Optional; anything that is not a short token is ignored.
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: Malformed subscription, or an endpoint that isn't acceptable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                malformed: { value: { error: "invalid subscription" } }
                private: { value: { error: "endpoint must not point at a private address" } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/push/status:
    get:
      tags: [push]
      operationId: pushStatus
      summary: Does the server hold this subscription?
      description: >-
        Whether the caller's account has a stored subscription with exactly this
        `endpoint`. The browser's `PushManager.getSubscription()` says nothing about
        the server's side — a row pruned after a dead send (404/410/403) leaves the
        browser subscribed to nowhere — so the client asks here before showing the
        notifications switch as on, and re-registers when the answer is no.
      parameters:
        - in: query
          name: endpoint
          required: true
          schema: { type: string, format: uri }
      responses:
        '200':
          description: The answer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribed: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/push/unsubscribe:
    post:
      tags: [push]
      operationId: pushUnsubscribe
      summary: Remove a Web-Push subscription
      description: Removes the caller's subscription with the given endpoint. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri }
      responses:
        '200':
          description: Removed (or was never there).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/push/test:
    post:
      tags: [push]
      operationId: pushTest
      summary: Send a test notification
      description: >-
        Sends a test push to all of the caller's subscriptions (localized with the
        `lang` in their synced state). Returns 200 even if delivery to individual
        endpoints fails — dead endpoints (404/410, and 403 for a subscription made
        against a VAPID key the instance no longer has) are pruned as a side effect.
      responses:
        '200':
          description: Sends attempted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/push/rest-timer:
    post:
      tags: [push]
      operationId: pushRestTimer
      summary: Schedule a server-side rest-timer push
      description: |
        Schedules one push after `seconds` (a number or numeric string ≥ 1, clamped to
        3600). One pending timer per
        device — `deviceId`, the same token the subscription was registered with; a
        new call from the same device replaces it, and the push goes only to that
        device's subscriptions. Without a `deviceId` there is one timer per account
        and the push goes to every subscription, as before. The client schedules this
        on rest start/extend and cancels on skip or on-screen completion — the push
        only actually fires when the tab was backgrounded/suspended and never got to
        cancel it. Timers live in memory: an API restart drops them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seconds]
              properties:
                seconds:
                  type: number
                  minimum: 1
                  maximum: 3600
                deviceId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{8,64}$'
                  description: The browser's own token, see `POST /api/push/subscribe`. Optional.
            example: { seconds: 90, deviceId: "3f9c1d2e7b0a4c6d9e8f1a2b3c4d5e6f" }
      responses:
        '200':
          description: Timer scheduled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: '`seconds` missing, not numeric, or below 1. Nothing is scheduled.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "seconds required" }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/push/rest-timer/cancel:
    post:
      tags: [push]
      operationId: pushRestTimerCancel
      summary: Cancel the pending rest-timer push
      description: >-
        Cancels the caller's scheduled rest-timer push, if any. With a `deviceId` only
        that device's timer; without one, every pending timer of the account. Idempotent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{8,64}$'
      responses:
        '200':
          description: Cancelled (or nothing was pending).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/activity:
    post:
      tags: [activity]
      operationId: postActivity
      summary: Live-workout presence heartbeat
      description: |
        The client pings this every ~20 s while a workout is on screen. Purely
        ephemeral, in-memory, never persisted; entries expire ~70 s after the last
        ping. `{"active": false}` drops the caller's entry immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                  description: false ends the presence; true (with the fields below) updates it.
                name:
                  type: string
                  maxLength: 60
                  description: Routine/workout name being trained.
                exIdx: { type: integer, description: Current exercise index (0-based). }
                exTotal: { type: integer, description: Exercises in the workout. }
                setsDone: { type: integer }
                setsTotal: { type: integer }
                startedAt:
                  type: number
                  description: Workout start, ms since epoch (defaults to now).
            example:
              active: true
              name: "Push Day"
              exIdx: 2
              exTotal: 5
              setsDone: 7
              setsTotal: 16
              startedAt: 1756500000000
      responses:
        '200':
          description: Presence updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ coach
  # User surface of the AI Coach (api/coach/routes.js). Enqueue → 202 {job:{id}} →
  # poll /api/coach/status. The demo build and the BYOK device mode run the same
  # core client-side and never reach these routes. The /api/admin/coach* handlers
  # were deleted from routes.js and are not documented here.

  /api/coach/disclosure:
    get:
      tags: [coach]
      operationId: getCoachDisclosure
      summary: What the consent screen must disclose
      description: |
        Provider identity and payload data categories, straight from the module
        that builds payloads so the consent screen cannot drift from what actually
        leaves (FR-09). Session only — no feature guard: which provider this box
        is wired to is nobody's business before sign-in.
      responses:
        '200':
          description: Disclosure terms.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachDisclosure' }
              example:
                provider: grok
                providerLabel: Grok
                categories: [plan, training, bodyweight, profile, prefs]
                version: 1
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/coach/status:
    get:
      tags: [coach]
      operationId: getCoachStatus
      summary: Poll job, proposal and cap state
      description: |
        What the client polls while a Coach surface is visible or a job is known
        to be in flight (~3 s while running, 60 s idle — see the client's
        coach-api.js). A proposal that expired is archived as a side effect of the
        poll that notices it. `last` reports how the most recent job ended, so a
        failure still surfaces instead of a job silently disappearing.
      responses:
        '200':
          description: Current job (null when idle), pending proposal (null when none), daily cap, last outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachStatus' }
              example:
                job: { id: "a1b2c3d4e5f60718", kind: create, state: running, startedAt: 1756500000000 }
                pending: null
                cap: { used: 3, limit: 20 }
                last: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/plan:
    post:
      tags: [coach]
      operationId: postCoachPlan
      summary: Enqueue plan creation or refinement
      description: |
        A minutes-scale background job: `202 {job:{id}}` means queued, not done —
        poll /api/coach/status. Body is `{intake}` (first plan), `{refine}`
        (change request against the current plan), or both.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intake:
                  type: object
                  additionalProperties: true
                  description: First-plan intake answers (goal, days, equipment, limitations…).
                refine:
                  type: string
                  maxLength: 1000
                  description: Free-text change request applied to the current plan.
            example: { refine: "add a fifth pull day" }
      responses:
        '202': { $ref: '#/components/responses/CoachQueued' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CoachConsent' }
        '409': { $ref: '#/components/responses/CoachBusy' }
        '429': { $ref: '#/components/responses/CoachDailyCap' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/review:
    post:
      tags: [coach]
      operationId: postCoachReview
      summary: Enqueue a plan review
      description: |
        The job reads the recent training log and proposes plan adjustments with
        the evidence for each. `note` is an optional free-text hint (trimmed to
        1000 chars). Queued like /api/coach/plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 1000, description: Optional hint from the user. }
            example: { note: "the squat day felt too heavy this week" }
      responses:
        '202': { $ref: '#/components/responses/CoachQueued' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CoachConsent' }
        '409': { $ref: '#/components/responses/CoachBusy' }
        '429': { $ref: '#/components/responses/CoachDailyCap' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/debrief:
    post:
      tags: [coach]
      operationId: postCoachDebrief
      summary: Enqueue a single-workout debrief
      description: |
        One workout, read closely. Nothing is applied to the plan — the result is
        kept in the profile's coach log. `workoutId` selects the session (null
        debriefs the most recent). Queued like /api/coach/plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workoutId: { type: string, maxLength: 40, description: Workout to debrief; null → the latest. }
            example: { workoutId: "w_2026-09-20" }
      responses:
        '202': { $ref: '#/components/responses/CoachQueued' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CoachConsent' }
        '409': { $ref: '#/components/responses/CoachBusy' }
        '429': { $ref: '#/components/responses/CoachDailyCap' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/cohort:
    get:
      tags: [coach]
      operationId: getCoachCohort
      summary: Medians against opted-in profiles on this instance
      description: |
        How this profile compares with everyone here who shares themselves:
        medians only, at least `minPeople` people, never an individual. A
        `{ok:false}` answer explains why there is nothing to show (community off,
        this profile not sharing, or too few people).
      responses:
        '200':
          description: Cohort medians, or a reason there are none.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachCohort' }
              example:
                ok: true
                enabled: true
                sharing: true
                people: 7
                minPeople: 3
                unit: kg
                sessionsPerWeek: { median: 3.2, you: 3 }
                exercises: [{ id: "bench", name: "Bench Press", people: 6, median: 62.5, you: 70 }]
                rankPct: 61
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/cohort/share:
    post:
      tags: [coach]
      operationId: postCoachCohortShare
      summary: Opt this profile in or out of the cohort
      description: >
        Toggles whether the profile contributes to the cohort medians. The answer
        echoes the stored value, so the caller never has to trust its own write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                share: { type: boolean }
            example: { share: true }
      responses:
        '200':
          description: Stored value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  sharing: { type: boolean }
              example: { ok: true, sharing: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/pending/resolve:
    post:
      tags: [coach]
      operationId: postCoachPendingResolve
      summary: Decide on the pending proposal
      description: |
        Accepts, rejects or dismisses the proposal currently awaiting a decision.
        Applying the accepted changes is the client's job (with its undo
        snapshot); this route archives the proposal so two devices can never
        disagree about it. Answering when there is nothing pending is a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accepted:
                  type: array
                  items: { type: string }
                  description: Change ids the user approved.
                rejected:
                  type: array
                  items: { type: string }
                  description: Change ids the user declined.
                dismissed: { type: boolean, description: Drop the whole proposal without applying anything. }
            example: { accepted: ["c1", "c3"], rejected: ["c2"], dismissed: false }
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
              example: { ok: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/forget:
    post:
      tags: [coach]
      operationId: postCoachForget
      summary: Drop everything held server-side for this profile
      description: |
        Consent withdrawn or the Coach turned off: deletes the profile's job
        state, pending proposal and log immediately, without waiting for a sync
        to carry the news (D5). Session only — deliberately works even when the
        Coach is off, because withdrawing consent must never depend on the
        feature being up. Daily cap survives (it bounds spending, not data).
      responses:
        '200':
          description: Cleared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
              example: { ok: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/coach/account:
    get:
      tags: [coach]
      operationId: getCoachAccount
      summary: Whose provider account this profile is about to spend
      description: |
        Its own route because both the Coach screen and the admin card must state
        it, and neither should be inferring it from settings. In instance mode a
        second profile is refused outright — that is something the user has to be
        able to read before asking for a job, not after it is turned down.
        Session only.
      responses:
        '200':
          description: Account binding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachAccount' }
              example:
                mode: instance
                provider: grok
                providerLabel: Grok
                account: "user@example.com"
                connected: true
                reason: null
                message: null
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------- Firebase Cloud Functions
  # Not served by api/server.js — these are the Cloud Functions of the deployed
  # Firebase project (see README "Como funciona"). The `coach` function mirrors
  # the prompt shape of api/coach; `nutritionProxy` is how the app reaches
  # Nutritionix without ever shipping its keys. URL pattern:
  # https://us-central1-<project-id>.cloudfunctions.net/<name>

  /coach:
    servers:
      - url: https://us-central1-gymtask-ce4b6.cloudfunctions.net
        description: This deployment's project id — substitute your own.
    post:
      tags: [functions]
      operationId: postFunctionCoach
      summary: One-shot Grok completion (key stays server-side)
      description: |
        The simplest Coach entry point for a deployment without an api/ instance:
        send `{system, prompt}` (as built by `buildPromptParts`) or
        `{kind, payload}`; the function wraps it in the shared system prompt and
        answers with the completion. `XAI_API_KEY` (+ optional `XAI_MODEL`,
        default `grok-3-mini`) is read from the function's own env, never from a
        client bundle. Optional `model` and `temperature` (0–2, default 0)
        override per call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                system: { type: string, description: Extra rules appended to the shared system prompt. }
                prompt: { type: string, maxLength: 500000 }
                kind: { type: string, description: "Alternative to prompt — a pipeline kind." }
                payload:
                  type: object
                  additionalProperties: true
                  description: "Its payload, paired with `kind` (max 500k chars serialized)."
                model: { type: string, maxLength: 80 }
                temperature: { type: number, minimum: 0, maximum: 2 }
            example: { system: "Answer in pt-BR.", prompt: "Monte um treino de 3 dias." }
      responses:
        '200':
          description: Completion (`answer` is `text` parsed as JSON when it holds JSON, else null).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  model: { type: string }
                  text: { type: string }
                  answer: { description: Parsed JSON of `text` when present. }
              example: { ok: true, model: "grok-3-mini", text: "…", answer: null }
        '400':
          description: '`{ok:false, error}` — missing `XAI_API_KEY`, malformed body, or neither prompt nor payload.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { ok: false, error: "send { system, prompt } (from buildPromptParts) or { kind, payload }" }
        '502':
          description: '`{ok:false, error}` — xAI refused or was unreachable.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '504':
          description: '`{ok:false, error}` — the model did not answer within 60 s.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nutritionProxy:
    servers:
      - url: https://us-central1-gymtask-ce4b6.cloudfunctions.net
        description: This deployment's project id — substitute your own.
    post:
      tags: [functions]
      operationId: postFunctionNutritionProxy
      summary: Nutritionix pt-BR natural search (keys stay server-side)
      description: |
        Server-to-server proxy for food search: the app id/key ride in headers
        from `functions/.env` and are never exposed to the frontend. The client
        calls it via `VITE_NUTRITION_PROXY_URL`. `results` is the normalized
        contract; `foods` echoes the raw Nutritionix objects (temporary, for the
        per-100 g reader).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, description: Natural-language food query, e.g. "banana prata". }
            example: { query: "2 ovos e 1 banana" }
      responses:
        '200':
          description: Normalized foods.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  query: { type: string }
                  locale: { type: string, const: br }
                  source: { type: string, const: nutritionix }
                  count: { type: integer }
                  results:
                    type: array
                    items: { type: object, additionalProperties: true }
                  foods:
                    type: array
                    items: { type: object, additionalProperties: true }
        '400':
          description: '`{ok:false, error}` — no `query`, or the Nutritionix env vars are missing.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: '`{ok:false, error}` — Nutritionix refused or was unreachable.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '504':
          description: '`{ok:false, error}` — Nutritionix did not answer within 15 s.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gymsid
      description: |
        HMAC-signed session cookie. Sign-in itself is client-side (Firebase), so
        no route currently issues this cookie — routes that read it accept the
        value a self-hosted deployment's login or a previous session left behind.
        On HTTPS deployments it is issued as **`__Host-gymsid`** (host-locked,
        Secure); the unprefixed `gymsid` is what a plain-http `localhost` instance
        uses, and is still accepted for pre-upgrade sessions. HttpOnly + SameSite=Lax;
        browser clients never handle the value directly.
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        The same signed session token, carried as `Authorization: Bearer <token>`.
        Bearer requests skip the CSRF origin check — a browser never attaches this
        header on its own.

  responses:
    Unauthorized:
      description: No session, expired/revoked session, or a disabled account.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "not signed in" }
    CoachOff:
      description: >-
        503 — the Coach is disabled or not connected on this instance (feature
        guard), or this profile has no provider account / jobs are switched off
        for safety (on enqueue: `code: "off"` or `"unprivileged"`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "the Coach is not set up on this instance" }
    CoachBusy:
      description: >-
        409 — `code: "busy"` (a job for this profile is already queued or
        running) or `code: "shared"` (a personal credential is bound to another
        profile).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "the Coach is already thinking about your training", code: "busy" }
    CoachDailyCap:
      description: "429 — the per-profile or instance daily job limit was reached (`code: \"cap\"`)."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "the Coach is resting — try again tomorrow", code: "cap" }
    CoachConsent:
      description: "403 — the profile has not given consent, enforced server-side (`code: \"consent\"`)."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "the Coach needs your go-ahead first", code: "consent" }
    CoachQueued:
      description: Job queued — poll GET /api/coach/status for progress and outcome.
      content:
        application/json:
          schema:
            type: object
            properties:
              job:
                type: object
                properties:
                  id: { type: string, description: Job id for the status poll. }
          example: { job: { id: "a1b2c3d4e5f60718" } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message. This is the only error shape the API has.
        code:
          type: string
          description: >-
            Coach rejections only — `off | busy | consent | cap | shared |
            unprivileged`, so clients can branch without parsing English.

    Ok:
      type: object
      properties:
        ok: { type: boolean, const: true }

    SessionUser:
      type: object
      description: The caller's identity, as returned by /api/me.
      properties:
        id: { type: string, description: Stable user id (16 base64url chars). }
        name: { type: string }
      example: { id: "Zk3q9XyPbA2LmN0v", name: "Ada" }

    # ------------------------------------------------------------------ state sync
    State:
      type: object
      description: |
        The whole app state as one blob. The server treats it as opaque (it only
        strips `active` on save and reads a few fields for reminders) — the schema
        below is **representative, not enforced** (except
        `workouts` and `routines`, which must be arrays (or null) when present), and grows
        with the app. Concurrent writes are caught by the server's revision (`_rev`,
        see PUT /api/data); the client merges the two documents and decides by `_ts`
        which side's settings win.
      properties:
        _ts:
          type: number
          description: Client-set last-write timestamp (ms since epoch); drives sync.
        _rev:
          type: integer
          readOnly: true
          description: Server-set revision, incremented on every accepted PUT. Ignored when sent by a client.
        unit: { type: string, enum: [kg, lb] }
        lang:
          type: string
          description: UI language code ("en", "de", "pt", …) — also localizes pushes.
        theme: { type: string }
        accent: { type: string }
        workouts:
          type: array
          description: Completed workouts, chronological.
          items: { $ref: '#/components/schemas/Workout' }
        routines:
          type: array
          items: { $ref: '#/components/schemas/Routine' }
        week:
          type: object
          description: 'Weekly plan: weekday (0=Sunday … 6) → routine id.'
          additionalProperties: { type: string }
        dayPlan:
          type: object
          description: >-
            Per-date overrides: ISO date → routine id, or "rest". Wins over `week`.
          additionalProperties: { type: string }
        bodyweight:
          type: array
          items: { $ref: '#/components/schemas/BodyweightEntry' }
        customEx:
          type: array
          description: User-created exercises (id, name, muscles…).
          items: { type: object, additionalProperties: true }
        exWeights:
          type: object
          description: 'Per-exercise last/best weight memory: exercise id → {w, d}.'
          additionalProperties: { type: object, additionalProperties: true }
        reminder:
          type: object
          description: >-
            Daily "workout planned today" push. The server reads this: at `time`
            (HH:MM, in `tz`) it sends one push if a routine is planned and nothing
            was logged yet.
          properties:
            'on': { type: boolean }
            time: { type: string, example: "08:00" }
            tz:
              oneOf: [{ type: string }, { type: 'null' }]
              description: IANA zone ("Europe/Zurich"); the user's own clock.
        restSec: { type: number, description: Default rest-timer seconds. }
        effort:
          oneOf: [{ type: string, enum: [none, rir, rpe] }, { type: 'null' }]
        equipProfiles: { type: array, items: { type: object, additionalProperties: true } }
        settings:
          type: object
          description: >-
            Catch-all note: the remaining top-level keys (sound, keepAwake, gifSize,
            targetW, autoBackup, …) are flat settings values like the ones above.
          additionalProperties: true
      additionalProperties: true

    Workout:
      type: object
      description: One completed workout (representative shape).
      properties:
        id: { type: string }
        d: { type: string, format: date, description: 'ISO day, e.g. "2026-08-30".' }
        start: { type: number, description: ms since epoch }
        end: { type: number }
        routineId: { type: string }
        name: { type: string }
        bw: { type: number, description: 'Body weight that day, in `unit`.' }
        vol: { type: number, description: Total volume (Σ weight × reps). }
        prs:
          type: array
          items: { type: string }
          description: Exercise ids that hit a personal record.
        entries:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: Exercise id. }
              topW: { oneOf: [{ type: number }, { type: 'null' }] }
              sets:
                type: array
                items:
                  type: object
                  properties:
                    w: { type: number, description: Weight. }
                    r: { type: number, description: Reps. }
                    done: { type: boolean }
                    rir: { type: number }
                    rpe: { type: number }
                  additionalProperties: true
            additionalProperties: true
      additionalProperties: true

    Routine:
      type: object
      description: A workout template (representative shape).
      properties:
        id: { type: string }
        name: { type: string }
        emoji: { type: string }
        ex:
          type: array
          description: Exercises with set/rep targets.
          items: { type: object, additionalProperties: true }
      additionalProperties: true

    BodyweightEntry:
      type: object
      properties:
        d: { type: string, format: date }
        w: { type: number, description: Weight in `unit`. }
        t: { type: number, description: Timestamp (ms). }
      additionalProperties: true

    # ------------------------------------------------------------------ push
    PushSubscription:
      type: object
      description: The browser's PushSubscription.toJSON() — only these fields are stored.
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          format: uri
          description: Public https:// push-service URL.
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }

    # ------------------------------------------------------------------ coach
    CoachDisclosure:
      type: object
      description: What the consent screen shows before any payload leaves.
      properties:
        provider: { type: string, example: grok }
        providerLabel: { type: string, example: Grok }
        categories:
          type: array
          items: { type: string }
          description: Payload data categories — plan, training, bodyweight, profile, prefs.
        version: { type: integer, description: Disclosure version, bumped when categories change. }
      additionalProperties: true

    CoachJob:
      type: object
      description: A queued or running background job.
      properties:
        id: { type: string, example: "a1b2c3d4e5f60718" }
        kind: { type: string, enum: [create, review, debrief] }
        state: { type: string, enum: [queued, running] }
        startedAt: { type: number, description: Enqueue time, ms since epoch. }
      additionalProperties: true

    CoachPending:
      type: object
      description: >
        A finished proposal awaiting accept/reject, already validated
        server-side (representative shape — the change kinds grow with the app).
      properties:
        id: { type: string }
        kind: { type: string, enum: [create, review, debrief] }
        changes:
          type: array
          items: { type: object, additionalProperties: true }
        expiresAt:
          type: number
          description: Expiry, ms since epoch — enforced lazily by the next status poll.
      additionalProperties: true

    CoachStatus:
      type: object
      description: The answer of every status poll.
      properties:
        job:
          oneOf:
            - $ref: '#/components/schemas/CoachJob'
            - type: 'null'
          description: The profile's queued/running job, or null when idle.
        pending:
          oneOf:
            - $ref: '#/components/schemas/CoachPending'
            - type: 'null'
          description: Proposal awaiting a decision, or null.
        cap:
          type: object
          properties:
            used: { type: integer, description: Jobs this profile enqueued today (midnight UTC reset). }
            limit: { type: integer, description: "`caps.perProfileDaily`; 0 means unlimited." }
        last:
          description: How the most recent job ended; null when it never ran.
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: string }
                kind: { type: string, enum: [create, review, debrief] }
                outcome:
                  type: string
                  description: e.g. applied, dismissed, failed, expired.
                errorClass:
                  oneOf: [{ type: string }, { type: 'null' }]
                  description: Coarse failure class shown to the user; never provider detail.
                at: { type: number, description: ms since epoch. }
                reading: { type: string, description: Optional one-line summary the chat bubble shows. }
              additionalProperties: true
      additionalProperties: true

    CoachAccount:
      type: object
      description: Whose provider account this profile is about to spend.
      properties:
        mode: { type: string, example: instance, description: "`authMode` — whose credential pays." }
        provider: { type: string, example: grok }
        providerLabel: { type: string, example: Grok }
        account:
          oneOf: [{ type: string }, { type: 'null' }]
          description: Credential's account label — never the credential itself.
        connected: { type: boolean }
        reason:
          oneOf: [{ type: string }, { type: 'null' }]
          description: Machine-readable reason when not connected (e.g. shared-account).
        message:
          oneOf: [{ type: string }, { type: 'null' }]
          description: Human-readable counterpart of `reason`.
      additionalProperties: true

    CoachCohort:
      type: object
      description: >
        Medians across this instance's opted-in profiles — never an individual.
        `ok:false` variants explain why there is nothing to show.
      properties:
        ok: { type: boolean }
        enabled: { type: boolean, description: "`false` — community off on this instance." }
        sharing: { type: boolean, description: "`false` — this profile does not share itself." }
        people: { type: integer, description: "Participants (present once sharing and enabled)." }
        minPeople: { type: integer, description: Minimum participants before anything is shown. }
        unit: { type: string, enum: [kg, lb] }
        sessionsPerWeek:
          type: object
          properties:
            median: { type: number }
            you: { type: number }
        exercises:
          type: array
          description: Medians for exercises enough people share.
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              people: { type: integer }
              median: { oneOf: [{ type: number }, { type: 'null' }] }
              you: { oneOf: [{ type: number }, { type: 'null' }] }
            additionalProperties: true
        rankPct: { oneOf: [{ type: number }, { type: 'null' }] }
      additionalProperties: true
